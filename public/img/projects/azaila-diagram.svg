  <text x="24" y="52" fill="#711e09" font-family="Arial, sans-serif" font-size="12">API REST | Spring Boot | MVC | MySQL</text>

  <text x="24" y="78" fill="#b74e22" font-family="Arial, sans-serif" font-size="11" font-weight="700">ARQUITECTURA MVC</text>

  <rect x="24" y="88" width="90" height="38" rx="6" fill="#fbd090" stroke="#b74e22" stroke-width="1.5"/>
  <text x="69" y="112" fill="#4a0f07" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Cliente</text>

  <rect x="130" y="88" width="100" height="38" rx="6" fill="#fbd090" stroke="#b74e22" stroke-width="1.5"/>
  <text x="180" y="112" fill="#4a0f07" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Controller</text>

  <rect x="246" y="88" width="90" height="38" rx="6" fill="#fbd090" stroke="#b74e22" stroke-width="1.5"/>
  <text x="291" y="112" fill="#4a0f07" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Service</text>

  <rect x="352" y="88" width="96" height="38" rx="6" fill="#fbd090" stroke="#b74e22" stroke-width="1.5"/>
  <text x="400" y="112" fill="#4a0f07" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Repository</text>

  <rect x="464" y="88" width="80" height="38" rx="6" fill="#711e09"/>
  <text x="504" y="112" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MySQL</text>

  <g stroke="#4a0f07" stroke-width="1.5" fill="none" marker-end="url(#azaila-arrow)">
    <line x1="114" y1="107" x2="126" y2="107"/>
