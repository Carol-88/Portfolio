    <line x1="130" y1="248" x2="350" y2="206"/>
    <line x1="375" y1="248" x2="375" y2="206"/>
    <line x1="610" y1="248" x2="390" y2="206"/>
    <line x1="445" y1="264" x2="655" y2="206"/>
    <line x1="130" y1="280" x2="340" y2="330"/>
    <line x1="375" y1="280" x2="375" y2="330"/>
    <line x1="610" y1="280" x2="430" y2="330"/>
    <line x1="445" y1="364" x2="660" y2="206"/>
