  <rect x="24" y="330" width="220" height="88" rx="8" fill="#fef7ed" stroke="#cf7362" stroke-width="1"/>
  <text x="38" y="352" fill="#4a0f07" font-family="Arial, sans-serif" font-size="10" font-weight="700">Endpoints</text>
  <text x="38" y="370" fill="#711e09" font-family="Arial, sans-serif" font-size="9">/habitantes /organizadores</text>
  <text x="38" y="384" fill="#711e09" font-family="Arial, sans-serif" font-size="9">/staff /eventos /participaciones</text>
  <text x="38" y="402" fill="#711e09" font-family="Arial, sans-serif" font-size="9">Eventos comunitarios - Azaila, Teruel</text>
